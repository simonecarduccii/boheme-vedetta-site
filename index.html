<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Bohème Vedetta — Bandi, open call e residenze per artisti</title>
<meta name="description" content="Bandi, open call e residenze per artisti, letti e controllati a mano dalla redazione di Bohème.">
<meta name="theme-color" content="#CCA40B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Colori, font e misure: gli stessi token del pannello, generati dal Figma. -->
<link rel="stylesheet" href="admin/tokens.css">
<style>
  /* Design C3 (Figma "Sito pubblico · proposte", nodi 28:94 e 30:129).
     Specifica: boheme-design/proposte/sito-pubblico/SPECIFICA.md */
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--colore-fondo-crema); color: var(--colore-nero-caldo);
    font-family: var(--font-testo); font-size: var(--testo-testo); line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  /* ---- testata + apertura gialle ---- */
  .giallo { background: var(--colore-giallo); color: var(--colore-bianco); }
  .testata {
    display: flex; align-items: center; justify-content: space-between; gap: var(--spazio-medio);
    padding: var(--spazio-testata-verticale) var(--spazio-testata-lati); position: relative;
  }
  .marchio { display: flex; align-items: center; gap: var(--spazio-logo); text-decoration: none; color: var(--colore-bianco); }
  .marchio svg { display: block; flex: none; }
  .menu { display: flex; gap: var(--spazio-grande); }
  .menu a { font-weight: 500; font-size: var(--testo-testo); text-decoration: none; color: var(--colore-bianco); }
  .menu a:hover { text-decoration: underline; }
  .apri-menu { display: none; }

  .apertura {
    max-width: calc(var(--layout-larghezza-contenuto) + 2 * var(--spazio-pagina-lati)); margin: 0 auto;
    padding: var(--spazio-blocchi) var(--spazio-pagina-lati) var(--spazio-pagina-alto);
    display: flex; flex-direction: column; gap: var(--spazio-grande);
  }
  .apertura h1 {
    margin: 0; font-family: var(--font-titoli); font-weight: 700; font-size: 48px;
    letter-spacing: -0.02em; line-height: 1.15;
  }
  .apertura p { margin: 0; font-weight: 500; font-size: var(--testo-sezione); }
  .ricerca {
    width: 100%; font: inherit; font-size: var(--testo-sezione); color: var(--colore-nero-caldo);
    background: var(--colore-bianco); border: 1px solid var(--colore-linee); border-radius: var(--angoli-pillola);
    padding: var(--spazio-medio) var(--spazio-grande); outline: none;
  }
  .ricerca::placeholder { color: var(--colore-grigio-testo); }
  .ricerca:focus { box-shadow: 0 0 0 3px rgba(255,254,253,0.5); }

  /* ---- contenuto ---- */
  main {
    max-width: calc(var(--layout-larghezza-contenuto) + 2 * var(--spazio-pagina-lati)); margin: 0 auto;
    padding: var(--spazio-pagina-alto) var(--spazio-pagina-lati);
    display: flex; flex-direction: column; gap: var(--spazio-blocchi);
  }
  .filtri { display: flex; flex-wrap: wrap; gap: var(--spazio-piccolo); }
  .filtri button {
    font: inherit; font-weight: 500; font-size: var(--testo-testo); cursor: pointer;
    padding: var(--spazio-pillola-verticale) var(--spazio-pillola-orizzontale); border-radius: var(--angoli-pillola);
    background: var(--colore-bianco); color: var(--colore-nero-caldo); border: 1px solid var(--colore-linee);
  }
  .filtri button[aria-pressed="true"] {
    background: var(--colore-nero-caldo); color: var(--colore-bianco); border-color: var(--colore-nero-caldo); font-weight: 600;
  }
  .stato { margin: 0; font-size: var(--testo-sezione); color: var(--colore-grigio-testo); }

  .gruppo { display: flex; flex-direction: column; gap: var(--spazio-medio); }
  .gruppo h2 { margin: 0; font-family: var(--font-titoli); font-weight: 700; font-size: 24px; }
  .elenco { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--spazio-medio); }

  .bando {
    display: flex; align-items: flex-start; gap: var(--spazio-card);
    background: var(--colore-card-beige); border-radius: var(--angoli-card); padding: var(--spazio-grande);
  }
  .data {
    flex: none; width: var(--layout-scadenza); height: var(--layout-scadenza); border-radius: var(--angoli-scadenza);
    background: var(--colore-arte); color: var(--colore-bianco);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
  }
  .data .mese { font-weight: 500; font-size: var(--testo-piccolo); }
  .data .giorno { font-weight: 700; font-size: var(--testo-scadenza); }
  .testi { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: var(--spazio-elenco-stretto); }
  .testa { display: flex; flex-direction: column; gap: var(--spazio-elenco-stretto); }
  .etichetta { display: flex; gap: var(--spazio-piccolo); font-weight: 500; font-size: var(--testo-tag); letter-spacing: 0.1em; color: var(--colore-etichetta); }
  .bando h3 { margin: 0; font-family: var(--font-titoli); font-weight: 700; font-size: 19px; line-height: 1.25; }
  .bando h3 a { text-decoration: none; }
  .bando:hover h3 a { text-decoration: underline; }
  .etichetta .arte-nome { display: none; }
  /* Puccini 2.0: 2px tra titolo ed ente (le altre righe restano a 12). */
  .ente { color: var(--colore-grigio-testo); font-weight: 500; margin-top: calc(2px - var(--spazio-elenco-stretto)); }
  .chip-riga { display: flex; flex-wrap: wrap; gap: var(--spazio-piccolo); }
  .chip {
    font-weight: 600; font-size: var(--testo-piccolo); line-height: 1.3; border-radius: var(--angoli-pillola);
    padding: var(--spazio-minimo) 10px; border: 1px solid transparent; white-space: nowrap;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis;
  }
  .chip.premio { background: var(--colore-giallo); color: var(--colore-bianco); }
  .chip.gratis { background: var(--colore-verde); color: var(--colore-bianco); }
  .chip.info { background: var(--colore-bianco); border-color: var(--colore-linee); }
  .chip.arte { background: var(--colore-arte-tag); color: var(--colore-bianco); font-size: var(--testo-tag); }
  .descrizione {
    margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ---- telefono ---- */
  @media (max-width: 720px) {
    .testata { padding: var(--spazio-medio); }
    .menu { display: none; }
    .apri-menu {
      display: block; font: inherit; font-weight: 500; font-size: var(--testo-testo);
      background: none; border: 0; color: var(--colore-bianco); cursor: pointer; padding: var(--spazio-minimo) 0;
    }
    .testata.aperto .menu {
      display: flex; flex-direction: column; gap: var(--spazio-medio);
      position: absolute; right: var(--spazio-medio); top: 100%; z-index: 2;
      background: var(--colore-nero-caldo); padding: var(--spazio-medio) var(--spazio-grande); border-radius: var(--angoli-avviso);
    }
    .apertura { padding: var(--spazio-piccolo) var(--spazio-medio) var(--spazio-blocchi); gap: var(--spazio-medio); }
    .apertura h1 { font-size: var(--testo-titolo-pagina); }
    main { padding: var(--spazio-grande) var(--spazio-medio) var(--spazio-pagina-alto); gap: var(--spazio-sezioni); }
    .gruppo h2 { font-size: 20px; }
    .bando { display: grid; grid-template-columns: var(--layout-scadenza) 1fr; gap: var(--spazio-elenco-stretto) var(--spazio-medio); padding: var(--spazio-card); }
    .testi { display: contents; }
    .testa { gap: var(--spazio-minimo); }
    .etichetta .arte-nome { display: inline; }
    .chip.arte { display: none; }
    .ente { margin-top: calc(-1 * var(--spazio-elenco-stretto)); }
    .bando h3 { font-size: var(--testo-titolo-card); }
    .testi > :not(.testa) { grid-column: 1 / -1; }
  }
</style>
</head>
<body>

<div class="giallo">
  <header class="testata" id="testata">
    <a class="marchio" href="/opencalls/" aria-label="Bohème Vedetta"><svg aria-label="Bohème" role="img" width="108" height="38" viewBox="0 0 108 38" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M100.843 15.9479V13.3601H87.4727V34.2798H103L102.784 31.7978L93.403 28.3475V25.2206L96.7455 24.7893V21.6625L92.8639 21.1233V17.5652L100.843 15.9479Z" fill="currentColor"/><path d="M67.2454 37.852H64.8733L70.1567 9.81811H67.6767V8.30859H73.4992L76.8417 18.2283L80.292 8.30859H86.4379V9.81811H83.7423L88.163 34.2939H81.6937L79.1059 20.816L75.5478 31.3826L71.0192 20.0613L67.2454 37.852Z" fill="currentColor"/><path d="M52.1779 34.5032L52.3936 13.4777H67.8122V15.5264L58.3238 18.2219V22.6427L65.1863 22.9648L65.6184 26.2218L58.9708 26.7399V29.5433L70.1715 32.2372L70.5703 34.5032H52.1779Z" fill="currentColor"/><path d="M60.1568 12.3995C58.3454 12.4858 57.03 10.0274 56.5987 8.94918C57.7847 8.73354 58.3238 8.51787 59.0786 8.30225C59.6177 10.0274 61.6663 12.3276 60.1568 12.3995Z" fill="currentColor"/><path d="M40.6213 34.3953H37.4944L37.7101 9.05702L35.6615 8.41008V7.11621H41.8073L41.6995 15.742H46.875V7.11621H52.8053V8.41008L50.8644 9.05702V34.3953H47.6298L46.0124 24.26H42.3465L40.6213 34.3953Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M38.3805 23.6131C38.3805 30.0444 34.1324 35.258 28.8921 35.258C23.6518 35.258 19.4037 30.0444 19.4037 23.6131C19.4037 17.1818 23.6518 11.9683 28.8921 11.9683C34.1324 11.9683 38.3805 17.1818 38.3805 23.6131ZM32.9893 22.5349C32.9893 25.7505 31.3962 28.3573 29.4311 28.3573C27.466 28.3573 25.873 25.7505 25.873 22.5349C25.873 19.3192 27.466 16.7124 29.4311 16.7124C31.3962 16.7124 32.9893 19.3192 32.9893 22.5349Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M0 4.52856C0 4.52856 9.27275 2.33451e-06 9.81186 0C14.7717 -2.14759e-05 19.3003 4.45247 19.3003 9.81186C19.3003 12.4635 18.1047 14.961 16.3043 16.7125C18.7889 18.4591 20.5941 21.4071 20.5941 24.5836C20.5941 29.8834 16.1047 34.1798 10.5666 34.1798H2.47992V5.06767L0.754759 6.14589L0 4.52856ZM12.8309 9.48833C12.8309 12.168 11.5275 14.3404 9.9197 14.3404C9.4385 14.3404 8.98457 14.1458 8.58469 13.8012V5.17542C8.98457 4.83089 9.4385 4.63631 9.9197 4.63631C11.5275 4.63631 12.8309 6.80863 12.8309 9.48833ZM13.2622 24.3679C13.2622 27.643 11.5726 30.2981 9.48841 30.2981C9.13786 30.2981 8.79848 30.223 8.47641 30.0825V18.6533C8.79848 18.5127 9.13786 18.4376 9.48841 18.4376C11.5726 18.4376 13.2622 21.0927 13.2622 24.3679Z" fill="currentColor"/></svg></a>
    <button class="apri-menu" id="apri-menu" aria-expanded="false" aria-controls="menu">Menu</button>
    <nav class="menu" id="menu">
      <a href="/opencalls/">Bandi</a>
      <a href="https://instagram.com/bohememag" rel="noopener">Magazine</a>
      <a href="/">Chi siamo</a>
    </nav>
  </header>
  <section class="apertura">
    <h1>Bandi, open call e residenze per artisti.</h1>
    <p>Letti e controllati a mano dalla redazione di Bohème, aggiornati ogni giorno.</p>
    <input class="ricerca" id="ricerca" type="search" placeholder="Cerca un bando, un ente, una città…" aria-label="Cerca un bando">
  </section>
</div>

<main>
  <div class="filtri" id="filtri" role="group" aria-label="Filtra i bandi"></div>
  <p class="stato" id="stato">Carico i bandi…</p>
  <div id="gruppi"></div>
</main>

<script>
(function () {
  const SUPABASE_URL = "https://aqgxgdpsjyidambwipqg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_COi81UtfEAr0grmvCHqMMQ_pVJEWl4k";

  // Arti riconosciute dalle parole di `disciplines` (stessa regola del pannello).
  const ARTI = [
    ["Musica", "--arti-musica", /music|musica|sound|suono|compos/],
    ["Fotografia", "--arti-fotografia", /photo|fotogra/],
    ["Teatro", "--arti-teatro", /theat|teatr|perform|danc|danza/],
    ["Cinema", "--arti-cinema", /film|cinem|video|movie|audiovis/],
    ["Pittura", "--arti-pittura", /paint|pittur|visual art|arti visive|fine art/],
    ["Illustrazione", "--arti-illustrazione", /illustra|comic|fumett/],
    ["Scrittura", "--arti-scrittura", /literat|letterat|writ|scrittur|poe|narrat/],
    ["Architettura", "--arti-architettura", /architet/],
    ["Street Art", "--arti-street-art", /street art|mural/],
    ["Scultura", "--arti-scultura", /sculpt|scult/],
    ["Moda", "--arti-moda", /fashion|moda\b/],
    ["Stand Up Comedy", "--arti-stand-up-comedy", /comedy|stand.?up|comico/],
  ];
  const artiDi = (b) => {
    const t = String(b.disciplines || "").toLowerCase();
    return t ? ARTI.filter(([, , r]) => r.test(t)) : [];
  };
  const testoDi = (b) => [b.title, b.organization_name, b.description, b.disciplines, b.prizes, b.exhibition, b.location, b.organization_country]
    .filter(Boolean).join(" ").toLowerCase();
  const gratis = (b) => /^\s*(free|gratis|gratuit[oa]?|nessun|no fee|0\s*(€|eur)?\s*$)/i.test(b.cost || "");

  const FILTRI = [
    ["Tutti", () => true],
    ["Fotografia", (b) => artiDi(b).some(([n]) => n === "Fotografia")],
    ["Pittura", (b) => artiDi(b).some(([n]) => n === "Pittura")],
    ["Cinema", (b) => artiDi(b).some(([n]) => n === "Cinema")],
    ["Teatro", (b) => artiDi(b).some(([n]) => n === "Teatro")],
    ["Musica", (b) => artiDi(b).some(([n]) => n === "Musica")],
    ["Residenze", (b) => /residen/.test(testoDi(b))],
    ["Premi", (b) => !!b.prizes || /\b(prize|premio|premi|award)/.test(String(b.title || "").toLowerCase())],
    ["Gratis", gratis],
  ];

  const MESI = ["Gen", "Feb", "Mar", "Apr", "Mag", "Giu", "Lug", "Ago", "Set", "Ott", "Nov", "Dic"];
  const GRUPPI = ["Scadono oggi", "Questa settimana", "Questo mese", "Più avanti", "Senza scadenza"];

  const oggi = new Date(); oggi.setHours(0, 0, 0, 0);
  const giorno = (iso) => { const d = new Date(iso); if (isNaN(d)) return null; d.setHours(0, 0, 0, 0); return d; };
  function gruppoDi(b) {
    const d = b.deadline ? giorno(b.deadline) : null;
    if (!d) return 4;
    const giorni = Math.round((d - oggi) / 86400000);
    if (giorni < 0) return -1;
    if (giorni === 0) return 0;
    if (giorni <= 7) return 1;
    if (giorni <= 31) return 2;
    return 3;
  }

  // Primo importo in una frase ("Montepremi di $5,000 USD" -> "$ 5,000").
  function importo(testo) {
    const m = String(testo || "").match(/([€$£])\s?(\d[\d.,']*\d|\d)|(\d[\d.,']*\d|\d)\s?(€|eur\b|euro|usd|\$|gbp|£|chf)/i);
    if (!m) return null;
    if (m[1]) return m[1] + " " + m[2];
    const v = m[4].toLowerCase();
    const s = v === "usd" ? "$" : v === "gbp" ? "£" : v === "chf" ? "CHF" : v === "$" ? "$" : v === "£" ? "£" : "€";
    return s + " " + m[3];
  }
  const accorcia = (t, n) => { t = String(t).trim(); return t.length > n ? t.slice(0, n - 1).trim() + "…" : t; };

  function chip(classe, testo, colore) {
    const s = document.createElement("span");
    s.className = "chip " + classe;
    s.textContent = testo;
    s.title = testo;
    if (colore) s.style.setProperty("--colore-arte-tag", "var(" + colore + ")");
    return s;
  }

  function creaBando(b) {
    const arti = artiDi(b);
    const colore = arti.length ? "var(" + arti[0][1] + ")" : "var(--colore-giallo)";
    const li = document.createElement("li");
    li.className = "bando";
    li.style.setProperty("--colore-arte", colore);
    // Il giallo sul beige si legge poco: senza arte, "OPEN CALL" va nel giallo scuro.
    li.style.setProperty("--colore-etichetta", arti.length ? colore : "var(--colore-giallo-scuro-testo)");

    const data = document.createElement("div");
    data.className = "data";
    const d = b.deadline ? giorno(b.deadline) : null;
    if (d) {
      data.innerHTML = '<span class="mese"></span><span class="giorno"></span>';
      data.firstChild.textContent = MESI[d.getMonth()];
      data.lastChild.textContent = d.getDate();
      data.title = "Scade il " + d.toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" });
    } else {
      data.innerHTML = '<span class="giorno">?</span>';
      data.title = "Scadenza non indicata";
    }
    li.appendChild(data);

    const testi = document.createElement("div");
    testi.className = "testi";
    const testa = document.createElement("div");
    testa.className = "testa";
    testa.innerHTML = '<span class="etichetta"><span>OPEN CALL</span></span><h3></h3>';
    if (arti.length) {
      // Sul telefono l'etichetta porta anche l'arte: "OPEN CALL · FOTOGRAFIA".
      ["·", arti[0][0].toUpperCase()].forEach((testo) => {
        const parte = document.createElement("span");
        parte.className = "arte-nome";
        parte.textContent = testo;
        testa.firstChild.appendChild(parte);
      });
    }
    const h3 = testa.querySelector("h3");
    const link = b.opportunity_url || b.organization_website;
    if (link) {
      const a = document.createElement("a");
      a.href = link; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = b.title || "Senza titolo";
      h3.appendChild(a);
    } else h3.textContent = b.title || "Senza titolo";
    testi.appendChild(testa);

    if (b.organization_name) {
      const ente = document.createElement("div");
      ente.className = "ente";
      ente.textContent = b.organization_name + (b.organization_country ? " · " + b.organization_country : "");
      testi.appendChild(ente);
    }

    const chips = document.createElement("div");
    chips.className = "chip-riga";
    if (b.prizes) chips.appendChild(chip("premio", importo(b.prizes) || accorcia(b.prizes, 32)));
    if (gratis(b)) chips.appendChild(chip("gratis", "Gratis"));
    else if (b.cost) {
      const i = importo(b.cost);
      chips.appendChild(chip("info", i ? i + " di iscrizione" : accorcia(b.cost, 32)));
    }
    if (b.location) chips.appendChild(chip("info", accorcia(b.location, 40)));
    arti.forEach(([nome, c]) => chips.appendChild(chip("arte", nome, c)));
    if (b.description) {
      const p = document.createElement("p");
      p.className = "descrizione";
      p.textContent = b.description;
      testi.appendChild(p);
    }
    if (chips.childNodes.length) testi.appendChild(chips);
    li.appendChild(testi);
    return li;
  }

  // ---- stato della pagina ----
  let bandi = [];
  let filtro = 0;
  const statoEl = document.getElementById("stato");
  const gruppiEl = document.getElementById("gruppi");
  const ricercaEl = document.getElementById("ricerca");
  const filtriEl = document.getElementById("filtri");

  FILTRI.forEach(([nome], i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = nome;
    btn.setAttribute("aria-pressed", i === filtro ? "true" : "false");
    btn.addEventListener("click", () => {
      filtro = i;
      filtriEl.querySelectorAll("button").forEach((x, j) => x.setAttribute("aria-pressed", j === i ? "true" : "false"));
      disegna();
    });
    filtriEl.appendChild(btn);
  });
  ricercaEl.addEventListener("input", disegna);

  function disegna() {
    const q = ricercaEl.value.trim().toLowerCase();
    const visibili = bandi.filter((b) => FILTRI[filtro][1](b) && (!q || testoDi(b).includes(q)));
    gruppiEl.innerHTML = "";
    gruppiEl.style.display = "contents";
    if (!visibili.length) {
      statoEl.hidden = false;
      statoEl.textContent = bandi.length ? "Nessun bando per questa ricerca." : "Nessun bando pubblicato al momento. Torna a trovarci presto.";
      return;
    }
    statoEl.hidden = true;
    GRUPPI.forEach((titolo, g) => {
      const qui = visibili.filter((b) => b._gruppo === g);
      if (!qui.length) return;
      const sez = document.createElement("section");
      sez.className = "gruppo";
      const h2 = document.createElement("h2");
      h2.textContent = titolo;
      const ul = document.createElement("ul");
      ul.className = "elenco";
      qui.forEach((b) => ul.appendChild(creaBando(b)));
      sez.append(h2, ul);
      gruppiEl.appendChild(sez);
    });
  }

  // ---- menu su telefono ----
  const testata = document.getElementById("testata");
  const apri = document.getElementById("apri-menu");
  apri.addEventListener("click", () => {
    const aperto = testata.classList.toggle("aperto");
    apri.setAttribute("aria-expanded", aperto ? "true" : "false");
  });

  fetch(SUPABASE_URL + "/rest/v1/open_calls_public?select=*&order=deadline.asc.nullslast", {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY },
  })
    .then((r) => { if (!r.ok) throw new Error("Risposta non valida (" + r.status + ")"); return r.json(); })
    .then((righe) => {
      bandi = righe
        .filter((b) => b.status !== "expired")
        .map((b) => ({ ...b, _gruppo: gruppoDi(b) }))
        .filter((b) => b._gruppo >= 0);
      disegna();
    })
    .catch((err) => {
      statoEl.textContent = "Non riesco a leggere i bandi in questo momento.";
      console.error(err);
    });
})();
</script>

</body>
</html>
