<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Bohème Vedetta — Bandi e open call</title>
<meta name="description" content="Open call, residenze e premi per fotografi e artisti, raccolti e verificati da Bohème Magazine.">
<style>
  :root {
    --bg: #faf8f5;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e2ddd5;
    --accent: #8a3324;
    --card-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    max-width: 760px;
    margin: 0 auto;
    padding: 3rem 1.5rem 1.5rem;
  }
  header h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 2rem;
    margin: 0 0 0.4rem;
  }
  header p {
    color: var(--muted);
    margin: 0;
    font-size: 1rem;
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }
  .stato {
    color: var(--muted);
    font-size: 0.95rem;
    padding: 2rem 0;
    text-align: center;
  }
  ul.elenco {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .bando {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.25rem 1.5rem;
  }
  .bando h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.25rem;
    margin: 0 0 0.3rem;
  }
  .bando .ente {
    color: var(--muted);
    font-size: 0.95rem;
    margin-bottom: 0.6rem;
  }
  .bando .righe {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem 1.2rem;
    font-size: 0.9rem;
    margin-bottom: 0.6rem;
  }
  .bando .righe span strong {
    color: var(--fg);
  }
  .bando .righe span {
    color: var(--muted);
  }
  .bando p.descrizione {
    margin: 0.6rem 0 0;
    font-size: 0.95rem;
    color: #3a3a3a;
  }
  .bando a.link {
    display: inline-block;
    margin-top: 0.8rem;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .bando a.link:hover { text-decoration: underline; }
  .scaduto { opacity: 0.55; }
  footer {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 1.5rem 3rem;
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>

<header>
  <h1>Bandi e open call</h1>
  <p>Raccolti ogni notte da fonti verificate, rivisti a mano prima di comparire qui — a cura di Bohème Magazine.</p>
</header>

<main>
  <div id="stato" class="stato">Carico i bandi…</div>
  <ul id="elenco" class="elenco" hidden></ul>
</main>

<footer>
  Bohème Vedetta — prototipo. I dati arrivano da <code>open_calls_public</code>, aggiornata quando un bando viene rivisto e pubblicato.
</footer>

<script>
(function () {
  const SUPABASE_URL = "https://aqgxgdpsjyidambwipqg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_COi81UtfEAr0grmvCHqMMQ_pVJEWl4k";

  const statoEl = document.getElementById("stato");
  const elencoEl = document.getElementById("elenco");

  function formattaData(iso) {
    if (!iso) return null;
    const d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    return d.toLocaleDateString("it-IT", { day: "numeric", month: "long", year: "numeric" });
  }

  function creaBando(bando) {
    const li = document.createElement("li");
    li.className = "bando" + (bando.status === "expired" ? " scaduto" : "");

    const h2 = document.createElement("h2");
    h2.textContent = bando.title || "Senza titolo";
    li.appendChild(h2);

    if (bando.organization_name) {
      const ente = document.createElement("div");
      ente.className = "ente";
      ente.textContent = bando.organization_name +
        (bando.organization_country ? " · " + bando.organization_country : "");
      li.appendChild(ente);
    }

    const righe = document.createElement("div");
    righe.className = "righe";

    const scadenza = formattaData(bando.deadline);
    if (scadenza) {
      const span = document.createElement("span");
      span.innerHTML = "<strong>Scadenza:</strong> " + scadenza +
        (bando.status === "expired" ? " (scaduta)" : "");
      righe.appendChild(span);
    }
    if (bando.cost) {
      const span = document.createElement("span");
      span.innerHTML = "<strong>Costo:</strong> " + bando.cost;
      righe.appendChild(span);
    }
    if (bando.location) {
      const span = document.createElement("span");
      span.innerHTML = "<strong>Dove:</strong> " + bando.location;
      righe.appendChild(span);
    }
    if (righe.childNodes.length) li.appendChild(righe);

    if (bando.description) {
      const p = document.createElement("p");
      p.className = "descrizione";
      const testo = bando.description;
      p.textContent = testo.length > 280 ? testo.slice(0, 280).trim() + "…" : testo;
      li.appendChild(p);
    }

    const link = bando.opportunity_url || bando.organization_website;
    if (link) {
      const a = document.createElement("a");
      a.className = "link";
      a.href = link;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "Vai al bando →";
      li.appendChild(a);
    }

    return li;
  }

  fetch(
    SUPABASE_URL + "/rest/v1/open_calls_public?select=*&order=deadline.asc.nullslast",
    {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: "Bearer " + SUPABASE_ANON_KEY,
      },
    }
  )
    .then((res) => {
      if (!res.ok) throw new Error("Risposta non valida (" + res.status + ")");
      return res.json();
    })
    .then((bandi) => {
      if (!bandi.length) {
        statoEl.textContent = "Nessun bando pubblicato al momento. Torna a trovarci presto.";
        return;
      }
      statoEl.hidden = true;
      elencoEl.hidden = false;
      bandi.forEach((bando) => elencoEl.appendChild(creaBando(bando)));
    })
    .catch((err) => {
      statoEl.textContent = "Non riesco a leggere i bandi in questo momento.";
      console.error(err);
    });
})();
</script>

</body>
</html>
