<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Segnala un bando — Bohème Vedetta</title>
<meta name="description" content="Conosci un bando, una open call o una residenza per artisti? Segnalalo alla redazione di Bohème: lo controlliamo a mano prima di pubblicarlo.">
<link rel="canonical" href="https://bohememag.it/opencalls/segnala/">
<meta name="theme-color" content="#CCA40B">
<link rel="stylesheet" href="../admin/tokens.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--colore-fondo-crema); color: var(--colore-nero-caldo);
    font-family: var(--font-testo); font-size: var(--testo-testo); line-height: 1.45; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .giallo { background: var(--colore-giallo); color: var(--colore-bianco); }
  .testata {
    display: flex; align-items: center; justify-content: space-between; gap: var(--spazio-medio);
    padding: var(--spazio-testata-verticale) var(--spazio-testata-lati); position: relative;
  }
  .marchio { display: flex; align-items: center; text-decoration: none; color: var(--colore-bianco); }
  .marchio svg { display: block; flex: none; }
  .menu { display: flex; gap: var(--spazio-grande); }
  .menu a { font-weight: 500; text-decoration: none; color: var(--colore-bianco); }
  .menu a:hover { text-decoration: underline; }
  .apri-menu { display: none; }
  .apertura {
    max-width: calc(640px + 2 * var(--spazio-pagina-lati)); margin: 0 auto;
    padding: var(--spazio-blocchi) var(--spazio-pagina-lati) var(--spazio-blocchi);
    display: flex; flex-direction: column; gap: var(--spazio-medio);
  }
  .apertura h1 { margin: 0; font-family: var(--font-titoli); font-weight: 700; font-size: 40px; letter-spacing: -0.02em; line-height: 1.15; }
  .apertura p { margin: 0; font-weight: 500; font-size: var(--testo-sezione); }
  main { max-width: calc(640px + 2 * var(--spazio-pagina-lati)); margin: 0 auto; padding: var(--spazio-blocchi) var(--spazio-pagina-lati) var(--spazio-pagina-alto); }
  form { display: flex; flex-direction: column; gap: var(--spazio-grande); background: var(--colore-card-beige); border-radius: var(--angoli-card); padding: var(--spazio-grande); }
  .campo { display: flex; flex-direction: column; gap: 6px; }
  label { font-weight: 600; }
  .aiuto { font-size: var(--testo-dettagli); color: var(--colore-grigio-testo); font-weight: 400; }
  input, select, textarea {
    font: inherit; font-size: var(--testo-sezione); color: var(--colore-nero-caldo); width: 100%;
    background: var(--colore-bianco); border: 1px solid var(--colore-linee); border-radius: var(--angoli-filtro);
    padding: var(--spazio-ricerca-verticale) var(--spazio-medio);
  }
  textarea { min-height: 110px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--colore-giallo); outline-offset: 1px; }
  .due { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spazio-grande); }
  .trappola { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  button[type="submit"] {
    align-self: flex-start; font: inherit; font-weight: 600; font-size: var(--testo-sezione); cursor: pointer;
    padding: var(--spazio-pillola-verticale) var(--spazio-grande); border-radius: var(--angoli-pillola);
    background: var(--colore-nero-caldo); color: var(--colore-bianco); border: 1px solid var(--colore-nero-caldo);
  }
  button[disabled] { opacity: 0.6; cursor: default; }
  .msg { margin: 0; padding: var(--spazio-avviso-verticale) var(--spazio-medio); border-radius: var(--angoli-avviso); }
  .msg.ok { background: var(--colore-giallo-chiaro); color: var(--colore-giallo-scuro-testo); }
  .msg.errore { background: var(--colore-rosso-chiaro); color: var(--colore-rosso); }
  .nota { color: var(--colore-grigio-testo); font-size: var(--testo-dettagli); margin: var(--spazio-medio) 0 0; }
  @media (max-width: 720px) {
    .testata { padding: var(--spazio-medio); }
    .menu { display: none; }
    .apri-menu { display: block; font: inherit; font-weight: 500; background: none; border: 0; color: var(--colore-bianco); cursor: pointer; padding: var(--spazio-minimo) 0; }
    .testata.aperto .menu {
      display: flex; flex-direction: column; gap: var(--spazio-medio); position: absolute; right: var(--spazio-medio); top: 100%; z-index: 2;
      background: var(--colore-nero-caldo); padding: var(--spazio-medio) var(--spazio-grande); border-radius: var(--angoli-avviso);
    }
    .apertura { padding: var(--spazio-piccolo) var(--spazio-medio) var(--spazio-grande); }
    .apertura h1 { font-size: var(--testo-titolo-pagina); }
    main { padding: var(--spazio-grande) var(--spazio-medio) var(--spazio-pagina-alto); }
    form { padding: var(--spazio-card); gap: var(--spazio-card); }
    .due { grid-template-columns: 1fr; gap: var(--spazio-card); }
  }
</style>
</head>
<body>

<div class="giallo">
{{TESTATA}}
  <section class="apertura">
    <h1>Segnala un bando.</h1>
    <p>Conosci un bando, una open call o una residenza che manca? Mandacelo: la redazione lo controlla a mano prima di pubblicarlo.</p>
  </section>
</div>

<main>
  <form id="modulo" novalidate>
    <div class="campo">
      <label for="url">Link al bando <span class="aiuto">(obbligatorio)</span></label>
      <input id="url" name="url" type="url" inputmode="url" required maxlength="500" placeholder="https://…" autocomplete="url">
    </div>
    <div class="due">
      <div class="campo">
        <label for="categoria">Categoria</label>
        <select id="categoria" name="categoria">
          <option value="">Scegli…</option>
          <option>Fotografia</option>
          <option>Arte visiva</option>
          <option>Residenza</option>
          <option>Premio</option>
          <option>Altro</option>
        </select>
      </div>
      <div class="campo">
        <label for="scadenza">Scadenza</label>
        <input id="scadenza" name="scadenza" type="date">
      </div>
    </div>
    <div class="campo">
      <label for="titolo">Titolo del bando</label>
      <input id="titolo" name="titolo" maxlength="200">
    </div>
    <div class="campo">
      <label for="ente">Chi lo organizza</label>
      <input id="ente" name="ente" maxlength="200">
    </div>
    <div class="campo">
      <label for="note">Altro da sapere</label>
      <textarea id="note" name="note" maxlength="2000" placeholder="Costo, premi, città, requisiti…"></textarea>
    </div>
    <div class="campo">
      <label for="email">La tua email <span class="aiuto">(facoltativa, solo se vuoi una risposta)</span></label>
      <input id="email" name="email" type="email" maxlength="200" autocomplete="email">
    </div>
    <div class="trappola" aria-hidden="true">
      <label for="sito-web">Non compilare</label>
      <input id="sito-web" name="sito-web" tabindex="-1" autocomplete="off">
    </div>
    <p class="msg" id="msg" role="status" hidden></p>
    <button type="submit" id="invia">Invia la segnalazione</button>
  </form>
  <p class="nota">Le segnalazioni non vengono pubblicate in automatico: le legge la redazione. Non condividiamo la tua email con nessuno.</p>
</main>

<script>
(function () {
  const SUPABASE_URL = "https://aqgxgdpsjyidambwipqg.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_COi81UtfEAr0grmvCHqMMQ_pVJEWl4k";
  const form = document.getElementById("modulo");
  const msg = document.getElementById("msg");
  const invia = document.getElementById("invia");
  const aperta = Date.now();
  const val = (id) => document.getElementById(id).value.trim();
  const mostra = (testo, tipo) => { msg.textContent = testo; msg.className = "msg " + tipo; msg.hidden = false; };

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    let url = val("url");
    if (url && !/^https?:\/\//i.test(url)) url = "https://" + url;
    try { new URL(url); } catch (_) { mostra("Serve il link al bando, per esempio https://sito.it/bando.", "errore"); document.getElementById("url").focus(); return; }
    const email = val("email");
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { mostra("L'email non sembra giusta.", "errore"); return; }
    // Trappola per i robot: campo nascosto compilato, o invio in meno di 3 secondi.
    if (val("sito-web") || Date.now() - aperta < 3000) { mostra("Grazie! La redazione la guarderà presto.", "ok"); form.reset(); return; }
    const riga = {
      url: url.slice(0, 500),
      category: val("categoria") || null,
      title: val("titolo") || null,
      organization: val("ente") || null,
      deadline: val("scadenza") || null,
      notes: val("note") || null,
      contact_email: email || null,
    };
    invia.disabled = true; invia.textContent = "Invio…";
    fetch(SUPABASE_URL + "/rest/v1/bando_segnalazioni", {
      method: "POST",
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify(riga),
    })
      .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); form.reset(); mostra("Grazie! La segnalazione è arrivata: la redazione la controlla prima di pubblicarla.", "ok"); })
      .catch((err) => { console.error(err); mostra("Non sono riuscito a inviarla. Riprova tra poco, oppure scrivici su Instagram @bohememag.", "errore"); })
      .finally(() => { invia.disabled = false; invia.textContent = "Invia la segnalazione"; });
  });

  const testata = document.getElementById("testata");
  const apri = document.getElementById("apri-menu");
  apri.addEventListener("click", () => {
    const aperto = testata.classList.toggle("aperto");
    apri.setAttribute("aria-expanded", aperto ? "true" : "false");
  });
})();
</script>
</body>
</html>
